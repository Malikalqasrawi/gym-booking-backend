services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gymdb
      MYSQL_USER: gymapp
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    # Not published: only the api service can reach the database.

  api:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/gymdb?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: gymapp
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_ADMIN_INITIALPASSWORD: ${ADMIN_PASSWORD:-}
      APP_AUTH_GOOGLE_CLIENTID: ${GOOGLE_CLIENT_ID:-}
      APP_PAYMENTS_STRIPE_SECRETKEY: ${STRIPE_SECRET_KEY:-}
      APP_PAYMENTS_STRIPE_PUBLISHABLEKEY: ${STRIPE_PUBLISHABLE_KEY:-}
      APP_PAYMENTS_STRIPE_WEBHOOKSECRET: ${STRIPE_WEBHOOK_SECRET:-}

volumes:
  mysql-data:
