# ============================================================
#  Gymbooking backend settings
# ============================================================
spring.application.name=gymbooking
server.port=8080

# Your private settings (MySQL password, JWT secret, later the email key) live in local.properties
# next to pom.xml. That file is in .gitignore, so it never goes to GitHub.
spring.config.import=optional:file:./local.properties

# ---------- Database (MySQL) ----------
# createDatabaseIfNotExist=true → MySQL creates the "gymdb" database the first time.
spring.datasource.url=jdbc:mysql://localhost:3306/gymdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
# gymapp = a MySQL user that can only use gymdb (made by scripts/create-db-user.sh), not root.
spring.datasource.username=gymapp
# The password is set in local.properties:  spring.datasource.password=...
spring.datasource.password=

# "update" = Hibernate creates/updates tables to match your @Entity classes automatically
spring.jpa.hibernate.ddl-auto=update
# Set to true to see every SQL query in the console (good for learning)
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# See your tables with MySQL Workbench → Local instance 3306 → schema "gymdb"

# ---------- Gym clock ----------
# The gym is in Amman, so "today" and "now" are calculated in Amman time
# (even if the server runs somewhere else).
app.timezone=Asia/Amman

# ---------- Booking rules ----------
# Members can see and book up to this many days ahead (today included)
app.booking.days-ahead=14
# Free start times are offered every N minutes (09:00, 09:30, 10:00 ...)
app.booking.slot-step-minutes=30
# Today's sessions must start at least this many minutes from now
app.booking.min-notice-minutes=60
# A trainer must answer a request within this many hours (or before the session starts, if sooner)
app.booking.request-expiry-hours=24
# How many unanswered requests one member can have at the same time
app.booking.max-pending-per-member=3
# After the trainer accepts, the member must pay within this many hours (or before the session starts, if sooner)
app.booking.payment-window-hours=12
# A PAID session can be cancelled, with a full refund, until this many hours before it starts
app.booking.paid-cancel-hours=24

# ---------- Payments: Stripe TEST mode ----------
# The keys go in local.properties, never here (see local.properties.example):
#   app.payments.stripe.secret-key=sk_test_...       SECRET: can charge and refund. Server only.
#   app.payments.stripe.publishable-key=pk_test_...  public: the app needs it to open Stripe's payment screen
#   app.payments.stripe.webhook-secret=whsec_...     optional: from "stripe listen" (README section 8)
# Without keys the backend still starts, but paying answers "Payments aren't set up yet".
# Live keys (sk_live_...) are refused on purpose.
app.payments.stripe.api-base=https://api.stripe.com
# The name shown at the top of Stripe's payment screen
app.payments.merchant-name=Gym Booking

# ---------- Login tokens (JWT) ----------
# The secret that signs tokens is in local.properties (app.jwt.secret=...), NOT here:
# anyone who knows it can create their own admin token. If it's missing, the backend won't start.
app.jwt.expiration-minutes=1440

# ---------- Email verification ----------
app.verification.code-expiration-minutes=10
# Wrong codes allowed before the code is locked (a new code resets the count)
app.verification.max-attempts=5
# Minimum time between two codes for the same account
app.verification.resend-cooldown-seconds=60

# ---------- Login protection ----------
# 5 wrong passwords in a row → login refused for 15 minutes
app.login.max-attempts=5
app.login.lock-minutes=15

# ---------- Rate limiting (requests per minute, per IP address) ----------
# /api/auth/** (login, sign up, codes)
app.rate-limit.auth-per-minute=10
# every other endpoint
app.rate-limit.general-per-minute=100

# ---------- Notifications ----------
# console = print emails in the NetBeans output window (no setup needed)
# email   = send real emails using the spring.mail.* settings (put them in local.properties)
app.notifications.mode=console
