spring.application.name=gymbooking
server.port=8080

# Secrets (DB password, JWT secret, Stripe keys) go in local.properties, which is git-ignored.
spring.config.import=optional:file:./local.properties

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/gymdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=gymapp
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# "Today" and "now" are always evaluated in the gym's timezone, regardless of the server's.
app.timezone=Asia/Amman

# Booking rules
app.booking.days-ahead=14
app.booking.slot-step-minutes=30
app.booking.min-notice-minutes=60
# Deadlines are capped at the session start if that comes first.
app.booking.request-expiry-hours=24
app.booking.max-pending-per-member=3
app.booking.payment-window-hours=12
app.booking.paid-cancel-hours=24

# Payments (Stripe test mode). Keys are set in local.properties; live keys are rejected at startup.
# Without keys the app still starts and payment endpoints return 503.
app.payments.stripe.api-base=https://api.stripe.com
app.payments.merchant-name=Gym Booking
# Stripe can't charge JOD, so cards are charged the USD equivalent at the dinar's fixed peg
# (1 USD = 0.709 JOD). Set charge-currency=JOD and rate 1 for a provider that supports dinars.
app.payments.charge-currency=USD
app.payments.jod-exchange-rate=1.41044

# JWT (the signing secret app.jwt.secret is required and set in local.properties).
# Access tokens are short-lived; the app renews them with a refresh token, which lasts
# refresh-token-days after its last use.
app.jwt.expiration-minutes=15
app.auth.refresh-token-days=30

# Google sign-in for members: the "Web application" client ID from Google Cloud, set in
# local.properties (client IDs aren't secret, but they stay out of the repo like the rest). Empty
# turns Google sign-in off. The app must use the same ID as its serverClientId.
app.auth.google.client-id=
app.auth.google.jwks-uri=https://www.googleapis.com/oauth2/v3/certs

# Password for the first admin account (admin@gym.com). Set it in local.properties; if it's empty,
# a random password is generated and printed once in the log. Only used when the account is created.
app.admin.initial-password=

# Email verification
app.verification.code-expiration-minutes=10
app.verification.max-attempts=5
app.verification.resend-cooldown-seconds=60

# Invite codes emailed to trainers added by an admin (same attempt limit as verification codes)
app.trainer-invite.expiration-days=7

# Login lockout
app.login.max-attempts=5
app.login.lock-minutes=15

# Rate limits (requests per minute per client IP)
app.rate-limit.auth-per-minute=10
app.rate-limit.general-per-minute=100

# Emails. console: write them to the log instead of sending them (the default, for development);
# email: send them with the SMTP server below. Set app.notifications.mode=email and your Gmail
# address and app password (spring.mail.username, spring.mail.password) in local.properties.
app.notifications.mode=console
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Milliseconds; without these a mail server that stops answering would block the email thread forever.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Shown as the sender's name and at the top of every email
app.mail.from-name=Gym Booking
# How often to look for emails to try again (after a failed attempt or a restart)
app.mail.retry-check-seconds=60
# Sent and failed emails are kept this long (without their text) to see what went out, then deleted.
app.mail.keep-days=30

# Phone numbers are stored in international format (+962...). Members confirm theirs with a code
# sent by text message (SMS) before their first booking.
app.phone.code-expiration-minutes=10
app.phone.max-attempts=5
app.phone.resend-cooldown-seconds=60
app.phone.max-codes-per-day=5

# SMS through Twilio Verify. Without these (set them in local.properties), codes are written to the
# log instead of being texted.
app.sms.twilio.account-sid=
app.sms.twilio.auth-token=
app.sms.twilio.verify-service-sid=
app.sms.twilio.api-base=https://verify.twilio.com

# Members can rate a paid session for this long after it took place.
app.reviews.days-to-review=30

# Paid sessions get a reminder email to the member and the trainer this long before they start.
app.reminders.hours-before=24
