# Runs on GitHub's computers after every push to main and on every Pull Request.
# Two jobs:
#   1. test   – compiles the code and runs all JUnit tests (unit + API tests)
#   2. docker – builds the Docker image and starts MySQL + the API with docker compose,
#               then checks that /api/health answers (proves the one-command setup works)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and run all tests
        run: mvn -B -ntp verify

      - name: Keep the test reports if something failed
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: target/surefire-reports

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Create a throwaway .env (random values, used only in this run)
        run: |
          {
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "DB_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -base64 64 | tr -d '\n')"
          } > .env

      - name: Build the image and start MySQL + API
        run: docker compose up -d --build

      - name: Wait until the API answers
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health; then
              echo
              echo "API is up"
              exit 0
            fi
            sleep 5
          done
          echo "The API didn't start. Its log:"
          docker compose logs api
          exit 1

      - name: Stop and delete everything
        if: always()
        run: docker compose down -v
