name: CI

on:
  push:
    branches: [main]
  pull_request:

# The token GitHub gives these jobs can only read the code.
permissions:
  contents: read

# Actions are pinned to a commit, so a changed tag can't run different code here.
jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7   # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961   # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and run all tests
        run: mvn -B -ntp verify

      - name: Keep the test reports if something failed
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f   # v6
        with:
          name: test-reports
          path: target/surefire-reports

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5

      - name: Create a throwaway .env (random values, used only in this run)
        run: |
          {
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "DB_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -base64 64 | tr -d '\n')"
            echo "ENCRYPTION_KEY=$(openssl rand -base64 32)"
          } > .env

      - name: Build the image and start MySQL + API
        run: docker compose up -d --build

      - name: Wait until the API answers
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health; then
              echo
              echo "API is up"
              exit 0
            fi
            sleep 5
          done
          echo "The API didn't start. Its log:"
          docker compose logs api
          exit 1

      - name: Stop and delete everything
        if: always()
        run: docker compose down -v
